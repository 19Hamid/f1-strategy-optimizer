[project]
name = "f1-strategy-backend"
version = "0.1.0"
description = "AI-powered Formula 1 race strategy optimization system"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
