services:
  postgresql-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: f1_strategy_test
      POSTGRES_USER: f1_strategy
      POSTGRES_PASSWORD: f1_strategy_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U f1_strategy -d f1_strategy_test
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

